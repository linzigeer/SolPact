[package]
name = "solpact"
version = "0.1.0"
description = "Project-isolated milestone USDC escrow"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "solpact"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# Anchor SPL 0.31.1's IDL module unconditionally references token_interface.
# Enable that module for IDL generation only; on-chain contexts use Program<Token>.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
mainnet = []

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "associated_token"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
